name: Build Android APK

# 触发：推 main / 打 version tag / 手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许上传 Release 资产（打 tag 时）
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub ubuntu-latest runner 预装完整 Android SDK。复用预装 NDK/build-tools/cmake，
      # 只确保 NDK 27.2.12479018 存在（build.gradle 指定）。
      - name: Set up Android SDK (runner preinstalled)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "补装 NDK 27.2.12479018 ..."
            yes | "$SDKMGR" "ndk;27.2.12479018"
          fi
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 主语音模型 SenseVoice-Small int8 不入库，构建前下载并流式提取到 assets/models。
      # prepareOfflineModels task 检测到 model.int8.onnx 存在且体积合理即通过。
      - name: Download offline speech model (SenseVoice-Small int8)
        run: |
          MODEL_DIR="android/app/src/main/assets/models"
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/model.int8.onnx" ]; then
            echo "下载 SenseVoice-Small int8 模型 (163MB tar.bz2)..."
            curl -L --retry 3 \
              -o /tmp/sensevoice.tar.bz2 \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
            echo "流式提取 model.int8.onnx ..."
            tar -xOf --wildcards /tmp/sensevoice.tar.bz2 '*/model.int8.onnx' > "$MODEL_DIR/model.int8.onnx"
            rm -f /tmp/sensevoice.tar.bz2
            ls -la "$MODEL_DIR"
          else
            echo "模型已存在，跳过下载"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-ime-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk

      # 打 v* tag 时，自动把 APK 挂到对应 GitHub Release
      - name: Upload APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
