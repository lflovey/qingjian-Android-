name: Build Android APK

# 触发：推 main / 打 version tag / 手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许上传 Release 资产（打 tag 时）
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub ubuntu-latest runner 已预装 Android SDK（/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android（v3 在较新 sdkmanager 上装 'tools' 报错已实测失败）。
      # 直接用自带 sdkmanager 补装工程要求：NDK 27.2.12479018 / build-tools 35.0.0 / CMake 3.28.3。
      - name: Set up Android SDK & components (runner preinstalled)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls -la "$ANDROID_HOME"
          echo "--- sdkmanager: "
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          echo "--- 安装 NDK / build-tools / cmake ..."
          "$SDKMGR" "ndk;27.2.12479018" "build-tools;35.0.0" "cmake;3.28.3"
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 主语音模型 SenseVoice-Small int8 不入库，构建前下载并解压到 assets/models
      # prepareOfflineModels task 检测到 model.int8.onnx 存在且体积合理即通过。
      - name: Download offline speech model (SenseVoice-Small int8)
        run: |
          MODEL_DIR="android/app/src/main/assets/models"
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/model.int8.onnx" ]; then
            echo "下载 SenseVoice-Small int8 模型 (163MB tar.bz2)..."
            curl -L --retry 3 \
              -o /tmp/sensevoice.tar.bz2 \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
            echo "解压 model.int8.onnx ..."
            tar xjf /tmp/sensevoice.tar.bz2 -C /tmp --wildcards '*/model.int8.onnx'
            find /tmp -maxdepth 3 -name 'model.int8.onnx' -exec cp {} "$MODEL_DIR/model.int8.onnx" \;
            rm -f /tmp/sensevoice.tar.bz2
            ls -la "$MODEL_DIR"
          else
            echo "模型已存在，跳过下载"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-ime-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk

      # 打 v* tag 时，自动把 APK 挂到对应 GitHub Release
      - name: Upload APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
