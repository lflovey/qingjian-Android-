name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (runner preinstalled)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # CMake：不锁版本，用 runner 系统自带 cmake（ubuntu-24.04 预装 3.28.x）。
          # 曾尝试 sdkmanager 装 'cmake;3.28.3' 但 SDK 仓库无此组件（Failed to find package），
          # 且 build.gradle 已移除 externalNativeBuild.cmake.version。做可用性兜底检查：
          if ! command -v cmake > /dev/null 2>&1; then
            echo "::error::系统未找到 cmake，runner 预装异常"
            exit 1
          fi
          echo "system cmake: $(cmake --version | head -n1)"
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo 'install NDK 27.2.12479018 ...'
            yes | "$SDKMGR" 'ndk;27.2.12479018'
          fi
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download offline speech model
        run: |
          MODEL_DIR="android/app/src/main/assets/models"
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/model.int8.onnx" ]; then
            curl -L --retry 3 -o /tmp/sensevoice.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2
            python3 .github/scripts/extract_model.py /tmp/sensevoice.tar.bz2 "$MODEL_DIR"
            rm -f /tmp/sensevoice.tar.bz2
            ls -la "$MODEL_DIR"
          else
            echo 'model already exists, skip'
          fi

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-ime-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
